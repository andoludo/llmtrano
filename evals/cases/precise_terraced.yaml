id: precise_terraced
opening: >-
  Terraced house built in 1998 in Leuven, 115 m2 on two floors, rooms 2.6 m high. Cavity walls with 6 cm of
  insulation, 12 cm of mineral wool in the roof, the floor is not insulated, HR++ glazing, and the house is
  fairly airtight. We heat to 20 degrees from 6 to 22 and 16 at night. Four people live here.
