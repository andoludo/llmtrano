[project]
name = "llmtrano"
version = "0.1.0"
description = "Local-first LLM assistant that turns a house description into a trano model, simulates it and explains the result."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0,<2",
    "arq>=0.28.0,<0.29",
    "fastapi>=0.145.0,<0.146",
    "gradio>=6.30.0,<7",
    "httpx>=0.28.1,<1",
    "langgraph>=1.2.16,<1.3",
    "langgraph-checkpoint-postgres>=3.2.0,<3.3",
    "openai>=3.35.1,<4",
    "prometheus-client>=0.26.0,<1",
    "psycopg-pool>=3.3.3,<4",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "pyyaml>=6.0.3,<7",
    "redis>=5.3.1,<6",
    "sqlalchemy>=2.1.5,<2.2",
    "trano>=0.56.0,<0.57",
    "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.17.1,<0.18",
    "syrupy>=6.1.1,<7",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.format]
# ruff formats Python blocks inside Markdown; the docs are hand-written specs, keep them as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# trano has inline types but no py.typed marker yet: read them anyway, do not check trano itself.
# trano-simulate ships py.typed and needs no override.
module = ["trano", "trano.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared fakes: `from fakes import ...`
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not llm and not simulation and not compose' --strict-markers"
markers = [
    "llm: needs a running LLM endpoint (GPU)",
    "simulation: needs OpenModelica and trano's local runtime",
    "compose: needs the running docker compose stack",
]

